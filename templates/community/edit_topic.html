{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Topic - Health Companion Forum</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'health_assistant/css/dark-mode.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .breadcrumb {
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .breadcrumb a {
            color: var(--accent-secondary);
            text-decoration: none;
        }

        .form-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
        }

        .form-container h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--accent-secondary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-secondary);
        }

        .form-group textarea {
            min-height: 200px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent-secondary);
            color: white;
        }

        .btn-primary:hover {
            background: #32998E;
        }

        .btn-secondary {
            background: var(--button-bg);
            color: var(--button-text);
        }

        .btn-secondary:hover {
            background: var(--button-hover);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="breadcrumb">
            <a href="{% url 'forum_home' %}"><i class="fas fa-home"></i> Forum</a> /
            <a href="{% url 'category_view' topic.category.id %}">{{ topic.category.name }}</a> /
            <a href="{% url 'topic_view' topic.id %}">{{ topic.title }}</a> /
            <span>Edit</span>
        </div>

        <div class="form-container">
            <h1><i class="fas fa-edit"></i> Edit Topic</h1>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="title">Topic Title *</label>
                    <input type="text" id="title" name="title" required maxlength="200" value="{{ topic.title }}">
                </div>

                <div class="form-group">
                    <label for="content">Content *</label>
                    <textarea id="content" name="content" required>{{ topic.content }}</textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                    <a href="{% url 'topic_view' topic.id %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="{% static 'health_assistant/js/theme-toggle.js' %}"></script>
</body>

</html>
