{% load static %}
{% load avatar_tags %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Companion - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050507;
            color: #F3F4F6;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .ambient {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 70% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 30% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 40%);
        }

        .glass-panel {
            background: rgba(14, 18, 27, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .info-row {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .info-row:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center relative p-6">

    <div class="ambient"></div>

    <!-- Back Link -->
    <a href="{% url 'index' %}"
        class="absolute top-8 left-8 flex items-center gap-2 text-gray-400 hover:text-white transition-colors group">
        <div
            class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-white/10 transition-all">
            <i class="fas fa-arrow-left text-xs"></i>
        </div>
        <span class="text-sm font-medium">Back to Home</span>
    </a>

    <div class="w-full max-w-lg animate__animated animate__fadeInUp">
        <div class="glass-panel rounded-3xl overflow-hidden">
            <!-- Header Banner -->
            <div class="h-32 bg-gradient-to-r from-brand-600/20 to-blue-600/20 border-b border-white/5 relative">
                <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20">
                </div>
            </div>

            <div class="px-8 pb-8">
                <!-- Avatar -->
                <div class="relative -mt-16 mb-6 flex justify-center">
                    <div class="w-32 h-32 rounded-full p-1 bg-[#0e121b] shadow-2xl">
                        <div class="w-full h-full rounded-full overflow-hidden bg-brand-500 relative group cursor-pointer"
                            style="background: {{ user.username|avatar_color }}">
                            <img src="{% avatar_3d_url user 150 %}" alt="{{ user.username }}'s avatar"
                                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div style="display: none;"
                                class="w-full h-full items-center justify-center text-white text-4xl font-bold">
                                {{ user.username|initials }}
                            </div>
                        </div>
                    </div>
                </div>

                <!-- User Info Header -->
                <div class="text-center mb-8">
                    <h1 class="font-display text-2xl font-bold text-white mb-1">{{ user.username }}</h1>
                    <p class="text-gray-400 text-sm">Member since {{ user.date_joined|date:"F Y" }}</p>
                </div>

                <!-- Info Grid -->
                <div class="space-y-3 mb-8">
                    <div class="info-row rounded-xl p-4 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-gray-400">
                                <i class="fas fa-envelope text-xs"></i>
                            </div>
                            <span class="text-sm text-gray-400">Email</span>
                        </div>
                        <span class="text-sm font-medium text-white">{{ user.email }}</span>
                    </div>

                    <div class="info-row rounded-xl p-4 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-gray-400">
                                <i class="fas fa-phone text-xs"></i>
                            </div>
                            <span class="text-sm text-gray-400">Phone</span>
                        </div>
                        <span class="text-sm font-medium text-white">{{ user.phone_number|default:"Not provided"
                            }}</span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex gap-3">
                    <a href="{% url 'logout' %}"
                        class="flex-1 py-3 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 font-medium text-sm flex items-center justify-center gap-2 transition-colors">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
