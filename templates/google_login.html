<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Companion - Google Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050507;
            color: #F3F4F6;
            overflow: hidden;
        }

        /* Ambient Background */
        .ambient {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
            z-index: -1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .glass-card:hover {
            border-color: rgba(139, 92, 246, 0.3);
            box-shadow: 0 12px 48px rgba(139, 92, 246, 0.1);
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="ambient"></div>

    <a href="#"
        class="absolute top-6 left-6 text-gray-500 hover:text-white transition-colors flex items-center gap-2 text-sm font-medium"
        onclick="history.back(); return false;">
        <div
            class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center border border-white/5 hover:bg-white/10 hover:border-white/10 transition-all">
            <i class="fas fa-arrow-left"></i>
        </div>
        <span>Back</span>
    </a>

    <!-- Main Card -->
    <div
        class="glass-card w-full max-w-md rounded-3xl p-8 md:p-12 text-center relative overflow-hidden transition-all duration-300 transform-gpu">

        <!-- Logo Area -->
        <div class="mb-8">
            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-500 to-indigo-600 mb-6 shadow-lg shadow-brand-500/20 animate-float">
                <i class="fas fa-heartbeat text-3xl text-white"></i>
            </div>
            <h1 class="font-display text-4xl font-bold text-white mb-2">Health <span
                    class="text-brand-400">Companion</span></h1>
            <p class="text-gray-400 text-sm">Your AI-Powered Health Companion</p>
        </div>

        <!-- Welcome Message -->
        <div class="mb-10">
            <h2 class="text-xl font-semibold text-white mb-2">Welcome Back <span
                    class="inline-block hover:animate-spin">👋</span></h2>
            <p class="text-gray-500 text-sm">Sign in to continue your wellness journey</p>
        </div>

        <!-- Google Button Wrapper -->
        <div class="flex justify-center mb-8 relative z-10">
            <!-- The actual Google Button script injects here -->
            <div id="g_id_onload"
                data-client_id="689733937221-f9qtbv229ej2i399ajmstn1rggjukgkt.apps.googleusercontent.com"
                data-context="signin" data-ux_mode="popup"
                data-login_uri="http://localhost:8000/accounts/auth-receiver/" data-auto_prompt="false">
            </div>

            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_black"
                data-text="signin_with" data-size="large" data-logo_alignment="left" data-width="250">
            </div>
        </div>

        <!-- Trust Badge -->
        <div
            class="flex items-center justify-center gap-2 text-xs text-gray-500 bg-white/5 py-3 px-4 rounded-xl border border-white/5 mx-auto max-w-xs">
            <i class="fas fa-shield-alt text-brand-400"></i>
            <span>Secure Enterprise-Grade Encryption</span>
        </div>

    </div>

    <!-- Google One Tap Script -->
    <script src="https://accounts.google.com/gsi/client" async></script>
</body>

</html>
